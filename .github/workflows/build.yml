name: Build Camera DLLs

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Free/**"
      - "Plus/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Check required game references
        shell: pwsh
        run: |
          if (-not (Test-Path "libs/Assembly-CSharp.dll")) {
            Write-Error "Gorilla Tag game DLLs are intentionally not stored in this repository. Run Build-And-Install.ps1 on a PC with Gorilla Tag installed."
          }

      - name: Build Free
        run: dotnet build Free/SnowsCameraFree.csproj -c Release

      - name: Build Plus
        run: dotnet build Plus/SnowsCameraPlus.csproj -c Release

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: Snows-Camera-Mod
          path: |
            Free/bin/Release/SnowsCameraFree.dll
            Plus/bin/Release/SnowsCameraPlus.dll
